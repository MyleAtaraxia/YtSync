name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Sync version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bun -e '
            import fs from "node:fs";
            const v = process.env.VERSION.replace(/^v/, "");
            for (const p of ["extension/manifest.json", "extension/package.json"]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = v;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
          '

      - name: Build extension
        working-directory: extension
        run: bun run build

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp extension/dist/ytsync-firefox-v*.zip release/firefox.zip
          cp extension/dist/ytsync-chrome-v*.zip release/chrome.zip
          git ls-files -z | xargs -0 zip -q release/source.zip
          (cd release && for f in source.zip firefox.zip chrome.zip; do sha256sum "$f" > "$f.sha256"; done)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/source.zip \
            release/source.zip.sha256 \
            release/firefox.zip \
            release/firefox.zip.sha256 \
            release/chrome.zip \
            release/chrome.zip.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
