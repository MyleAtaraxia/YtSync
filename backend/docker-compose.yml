services:
  server:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      METRICS_API_KEY: "${METRICS_API_KEY:-}"
      METRICS_API_KEY_FILE: "/data/metrics_api_key"
    volumes:
      - server_data:/data
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  server_data:
